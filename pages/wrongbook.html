<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mistake Book · GRE Vocabulary Snapshot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231C2B48%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="nav-mount"></div>

<main class="wrap">
  <header class="hero" style="padding:48px 0 8px;text-align:left">
    <h1 style="font-size:32px">Mistake Book</h1>
    <p style="text-align:left;margin:0">Words you missed or couldn't recall during a review quiz are logged here automatically, sorted A–Z by default, with a running count of how many times you've missed each one.</p>
  </header>

  <div class="wrongbook-toolbar no-print">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="toggle-btn" id="sort-alpha" type="button">Sort A–Z</button>
      <button class="toggle-btn" id="sort-count" type="button">Sort by Mistake Count</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary" id="clear-btn" type="button">Clear Mistake Book</button>
      <button class="btn btn-primary" id="export-btn" type="button">Export as PDF</button>
    </div>
  </div>

  <div id="print-title" style="display:none">
    <h2>GRE Vocabulary Snapshot · Mistake Book</h2>
    <p id="print-date" style="color:#555;font-size:13px"></p>
  </div>

  <div id="wrongbook-content"></div>
</main>

<div id="footer-mount"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/wrongbook.js"></script>
<script>GRE.injectNav("wrongbook"); GRE.injectFooter();</script>
</body>
</html>
