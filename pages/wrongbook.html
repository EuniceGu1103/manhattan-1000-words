<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 · Manhattan 1000 Words</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231C2B48%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="nav-mount"></div>

<main class="wrap">
  <header class="hero" style="padding:48px 0 8px;text-align:left">
    <h1 style="font-size:32px">错题本</h1>
    <p style="text-align:left;margin:0">回顾测验中答错或未能想出的单词会自动记录在这里，按字母正序排列，并标注错误次数。</p>
  </header>

  <div class="wrongbook-toolbar no-print">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="toggle-btn" id="sort-alpha" type="button">按字母正序</button>
      <button class="toggle-btn" id="sort-count" type="button">按错误次数排序</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary" id="clear-btn" type="button">清空错题本</button>
      <button class="btn btn-primary" id="export-btn" type="button">导出为 PDF</button>
    </div>
  </div>

  <div id="print-title" style="display:none">
    <h2>Manhattan 1000 Words · 错题本</h2>
    <p id="print-date" style="color:#555;font-size:13px"></p>
  </div>

  <div id="wrongbook-content"></div>
</main>

<footer class="footer wrap no-print">
  Manhattan 1000 Words · <a href="../index.html">返回首页</a>
</footer>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/wrongbook.js"></script>

</body>
</html>
